function renderRail(){$('#rail').classList.toggle('pinned',ctx.pin);$('#rail').innerHTML=`<div class="brand"><span class="brand-mark">${I('pulse')}</span><span class="brand-word rail-label">AllyVora<span style="color:#88bcac">.</span></span></div><div class="nav-group rail-label">CARE OPERATIONS</div>${[['grid','Workspace','overview-nav'],['users','Patient access','patient-nav'],['calendar','Appointments','appointments'],['clipboard','OP registration','registration-nav'],['pulse','Clinical worklist','worklist'],['money','Revenue cycle','billing-nav']].map(([i,l,a])=>`<button class="nav-item ${a==='registration-nav'?'active':''}" data-action="${a}" title="${l}" aria-label="${l}">${I(i)}<span class="rail-label">${l}</span></button>`).join('')}<div class="bottom"><div class="nav-group rail-label">GOVERNANCE</div>${[['layers','Workflow coverage','coverage-map'],['shield','Safety checklist','compliance'],['clock','Audit trail','audit'],['pin',ctx.pin?'Unpin navigation':'Pin navigation','pin']].map(([i,l,a])=>`<button class="nav-item" data-action="${a}" title="${l}" aria-label="${l}">${I(i)}<span class="rail-label">${l}</span></button>`).join('')}</div>`}
function renderHeader(){$('#header').innerHTML=`<div class="flex"><button class="module flex gap6" data-action="modules">${I('grid')} Patient access <span class="hide-mobile">⌄</span></button><span class="divider"></span><span class="context-title muted small">Ambulatory care</span></div><div class="header-controls"><span class="badge amber hide-mobile">DESIGN DEMO</span><span class="flex gap6 branch-select">${I('building')}<label class="sr-only" for="branch">Branch</label><select id="branch" name="ctx.branch">${opt(['Central OP','Riverside OP'],ctx.branch)}</select></span><span class="divider"></span><div><span class="tiny demo-role-label" style="font-size:8px;display:block">DEMO ROLE</span><label class="sr-only" for="role">Demo role</label><select id="role" name="ctx.role">${opt(roles,ctx.role)}</select></div><button class="icon-btn" data-action="privacy" title="Privacy screen (Alt+P)" aria-label="Toggle privacy screen">${I('eye')}</button><button class="icon-btn" data-action="notifications" title="Operational notifications" aria-label="Operational notifications">${I('bell')}</button><button class="icon-btn" data-action="lock" title="Lock demo workspace" aria-label="Lock demo workspace">${I('lock')}</button><span class="user-avatar">DS</span></div>`}
function renderHeading(){$('#heading').innerHTML=`<section class="heading"><div><div class="breadcrumb">Patient access ${I('chevron')} Encounters ${I('chevron')} <span>Outpatient</span></div><h1>${R.id?'Outpatient visit workspace':'Ambulatory registration'}<span style="color:var(--teal)">.</span></h1><p class="subtitle">${R.id?'One encounter. A connected care journey.':'A simpler check-in. More time for care.'}</p></div><div class="flex" style="gap:24px"><div class="day-summary"><div><b>${patients.filter(p=>p.appointment?.date===DAY&&(p.appointment.branch||'Central OP')===ctx.branch).length}</b><span>Booked today</span></div><div><b>${visits.filter(v=>v.status!=='Discharged').length}</b><span>Active visits</span></div><div><b>${visits.filter(v=>v.status==='Discharged').length}</b><span>Completed</span></div></div>${B(I('calendar')+'<span>Today’s schedule</span>','appointments','','aria-label="Open today’s schedule"')}</div></section>`}
const stepNames=[['Patient','Find & verify'],['Visit details','Purpose & care team'],['Coverage & consent','Clear the essentials'],['Review & check-in','Confirm & route'],['Care & checkout','Continue the journey']];
function renderSteps(){$('#stepper').innerHTML=`<nav class="steps" aria-label="Registration progress">${stepNames.map(([name,desc],i)=>{let n=i+1,done=R.id?n<5:n<ctx.step;return`<button class="step ${ctx.step===n?'active':''} ${done?'done':''}" data-action="step" data-step="${n}" ${n===5&&!R.id?'disabled':''} ${R.id&&n<5?'disabled':''} ${ctx.step===n?'aria-current="step"':''}><span class="step-num">${done?I('check'):n}</span><span><strong>${name}</strong><small>${desc}</small></span></button>`}).join('')}</nav>`}
function renderStrip(){let p=patient();$('#patient-strip').innerHTML=p&&ctx.step>1?`<div class="patient-strip"><div class="flex"><span class="avatar ${p.color||''}">${initials(p.name)}</span><div><h3 class="phi">${esc(p.name)} <span class="badge teal small">${R.ident.name&&R.ident.dob?'Identity verified':'Verify identity'}</span></h3><div class="meta phi">${esc(p.id)} &nbsp; · &nbsp; DOB ${fmtDate(p.dob)} &nbsp; · &nbsp; ${age(p.dob)} years &nbsp; · &nbsp; ${esc(p.sex)}</div></div></div><div class="flex wrap gap6">${age(p.dob)<18?badge('Minor · representative','amber'):''}${R.visit.template==='Mental health'?badge('Restricted clinical notes','blue'):''}${p.alerts.length?badge(nursing()?p.alerts[0]:'Care-team alert on record','amber'):''}${R.id?badge(R.id,'teal'):B('Change patient','change-patient','sm')}</div></div>`:''}
function errorsBox(){return ctx.errors.length?`<div class="error-box" role="alert" tabindex="-1" id="errors"><strong>Please check the following</strong><div>${ctx.errors.map(esc).join('<br>')}</div></div>`:''}
function content(){if(ctx.step===1)return patientPage();if(ctx.step===2)return visitPage();if(ctx.step===3)return coveragePage();if(ctx.step===4)return reviewPage();return carePage()}
function renderFoot(){const ready=registrationErrors().length===0;let right='',left=`<span class="flex muted small foot-note">${I('shield')} Synthetic demo · changes stay in this browser tab &nbsp; ${B('Urgent handoff','urgent','link')}</span>`;if(!R.id){right=`${ctx.step>1?B(I('back')+'Back','back'):''}${B(I('file')+'Save draft','save-draft','',''+(!R.patientId?'disabled':''))}${ctx.step<4?B(`Continue ${I('arrow')}`,'next','primary'):B(I('check')+'Register & check in','register','primary')}`;left=ctx.step===4?`<span class="flex foot-note ${ready?'status-ok':'status-warn'}">${I(ready?'shield':'info')} ${ready?'Ready to check in':'Review required items before check-in'}</span>`:left}else{right=`${B('New registration','new-registration')}${B(I('print')+'Visit documents','documents')}${R.status!=='Discharged'?B((ctx.tab==='checkout'?'Complete encounter':'Go to checkout')+I('arrow'),ctx.tab==='checkout'?'complete':'go-checkout','primary'):badge('Encounter completed','teal')}`;left=`<span class="flex small foot-note">${I('clock')} ${esc(R.queueStatus)} · ${esc(R.id)}</span>`}$('#footbar').innerHTML=`${left}<div class="flex">${right}</div>`}
function norm(s){return String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]/g,'')}
function matchedPatients(){let q=ctx.query.trim(),parts=q.split(/\s+/).map(norm).filter(Boolean);return patients.filter(p=>{if(ctx.filter==='appointments'&&(!p.appointment||p.appointment.date!==DAY||(p.appointment.branch||'Central OP')!==ctx.branch))return false;let values=ctx.searchBy==='name'?[p.name]:ctx.searchBy==='mrn'?[p.id]:ctx.searchBy==='phone'?[p.phone]:ctx.searchBy==='id'?[p.identifier]:ctx.searchBy==='dob'?[p.dob,fmtDate(p.dob)]:ctx.searchBy==='member'?[p.member]:[p.id,p.name,p.phone,p.identifier,p.member,p.dob,fmtDate(p.dob)];let hay=values.map(norm).join('|');return parts.every(part=>hay.includes(part))}).sort((a,b)=>{let nq=norm(q);let ae=[a.id,a.identifier,a.member].some(v=>norm(v)===nq),be=[b.id,b.identifier,b.member].some(v=>norm(v)===nq);return Number(be)-Number(ae)})}
function patientPage(){return`${errorsBox()}<div class="workspace"><section class="panel"><div class="panel-head"><div><h2>Let’s find your patient</h2><p>Search once. Select a patient or their appointment.</p></div>${B(I('plus')+'New patient','new-patient','soft')}</div><div class="panel-pad" style="padding-bottom:17px"><div class="searchbox">${I('search')}<input id="patient-search" aria-label="Search patients" placeholder="Name, MRN, mobile, ID, member ID or date of birth…" value="${esc(ctx.query)}" autocomplete="off" spellcheck="false">${ctx.query?`<button class="icon-btn" data-action="clear-search" title="Clear search" aria-label="Clear search">${I('close')}</button>`:'<span class="kbd">Alt + K</span>'}</div><div class="search-help">Try <b>Maya</b>, <b>DEMO-1004</b> or <b>1986-03-18</b> · ↑ ↓ to move, Enter to select</div><div class="between mt20 wrap"><div class="segmented" aria-label="Patient list filter"><button data-action="filter" data-value="appointments" class="${ctx.filter==='appointments'?'active':''}">Today’s appointments <span class="pill">${patients.filter(p=>p.appointment?.date===DAY&&(p.appointment.branch||'Central OP')===ctx.branch).length}</span></button><button data-action="filter" data-value="all" class="${ctx.filter==='all'?'active':''}">All patients <span class="pill">${patients.length}</span></button><button data-action="filter" data-value="walk-in" class="${ctx.filter==='walk-in'?'active':''}">Walk-in</button></div><div class="flex gap6"><label class="small muted" for="search-by">Match</label><select id="search-by" name="ctx.searchBy" style="border:0;background:white;font-size:11px;color:var(--muted)">${opt([['all','All identifiers'],['name','Name'],['mrn','MRN'],['phone','Mobile'],['id','Identity document'],['dob','Date of birth'],['member','Insurance member']],ctx.searchBy)}</select></div></div></div><div id="patient-results">${patientResults()}</div></section><aside class="aside">${identityAside()}<div class="panel" ${R.patientId?'hidden':''}><div class="panel-pad"><div class="section-title">${I('spark')}<h3>Your shortest path to care</h3></div><div class="mini-task"><span class="circle">1</span><span>Select a patient and verify identity.</span></div><div class="mini-task"><span class="circle">2</span><span>Review prefilled visit details.</span></div><div class="mini-task"><span class="circle">3</span><span>Check coverage, consent and route.</span></div><div class="rule"></div><div class="between small"><span class="muted">Have an unfinished visit?</span>${B(`Drafts (${drafts.length})`,'drafts','link')}</div></div></div><div class="aside-note">${I('lock')} Only synthetic records are included. Patient information is not written to browser storage.</div></aside></div>`}
function patientResults(){let ps=matchedPatients();if(!ps.length)return`<div class="empty"><div class="empty-art">${I('search')}</div><h3>No matching patients</h3><p>Check the spelling or switch to all patients before creating a record.</p><div class="flex mt20" style="justify-content:center">${B('Search all patients','search-all','soft')}${B('New patient','new-patient')}</div></div>`;return`<div class="table-wrap"><table><thead><tr><th>Patient</th><th>Identity</th><th class="table-hide">Visit / care team</th><th>Arrival</th><th aria-label="Select"></th></tr></thead><tbody>${ps.map((p,i)=>{let ap=p.appointment,pr=providers.find(x=>x.id===ap?.provider);return`<tr class="selectable ${R.patientId===p.id?'selected':''} ${ctx.searchIndex===i?'keyboard':''}" data-action="select-patient" data-id="${p.id}"><td><div class="flex"><span class="avatar ${p.color||''}">${initials(p.name)}</span><div><div class="patient-name phi">${esc(p.name)}</div><div class="row-sub phi">${esc(p.id)} · ${age(p.dob)}y · ${esc(p.sex)}</div></div></div></td><td><div class="phi">${fmtDate(p.dob)}</div><div class="row-sub phi">Mobile ••• ${esc(p.phone.slice(-4))}</div></td><td class="table-hide"><div>${esc(pr?.specialty||'Select specialty')}</div><div class="row-sub">${esc(pr?.name||'Walk-in care')}</div></td><td>${ap?`<b>${ap.time}</b><div class="row-sub">${badge(ap.status,ap.status==='Booked'?'blue':'teal')}</div>`:badge('Walk-in')}</td><td><button class="icon-btn" data-action="select-patient" data-id="${p.id}" title="Select ${esc(p.name)}" aria-label="Select ${esc(p.name)}">${I(R.patientId===p.id?'check':'arrow')}</button></td></tr>`}).join('')}</tbody></table></div><div class="table-bottom between"><span>${ps.length} ${ps.length===1?'record':'records'} · ${ctx.query?'Filtered by your search':'Synthetic demonstration dataset'}</span><span class="flex gap6">${I('shield')} Verify two identifiers</span></div>`}
function identityAside(){let p=patient();if(!p)return`<div class="panel"><div class="panel-pad"><div class="between"><span class="tiny">Patient verification</span>${I('shield')}</div><div class="empty" style="padding:31px 0 10px"><div class="empty-art">${I('user')}</div><h3>The right patient. Every time.</h3><p>Select a patient to confirm their identity and continue.</p></div></div></div>`;let dup=patients.filter(q=>q.id!==p.id&&q.dob===p.dob&&norm(q.name).includes(norm(p.name.split(' ')[0])));return`<div class="panel"><div class="panel-pad"><div class="between"><span class="tiny">Confirm patient</span>${B(I('edit'),'edit-patient','sm','aria-label="Edit patient details"')}</div><div class="flex mt14"><span class="avatar large ${p.color||''}">${initials(p.name)}</span><div><h3 class="phi">${esc(p.name)}</h3><div class="small muted phi">${esc(p.id)}</div></div></div><div class="rule"></div>${row('Date of birth',fmtDate(p.dob))}${row('Administrative sex',p.sex)}${row('Language',p.language)}${row('Identifier',p.identifier)}${dup.length?notice('<strong>Similar record found</strong>Another patient has a similar name and date of birth. Confirm the MRN and identity document. Do not merge automatically.','amber','users'):''}<div class="rule"></div><h3 style="font-size:12px">Ask the patient to state</h3>${check('Full name confirmed','ident.name',R.ident.name,'Compare with the selected record.')}${check('Date of birth confirmed','ident.dob',R.ident.dob,'Use approved alternative identifiers when necessary.')} ${age(p.dob)<18?check('Guardian / representative verified','ident.guardian',R.ident.guardian,esc(p.guardian||'Record representative during coverage & consent.')):''}<div class="mt8">${notice('Identity is never pre-confirmed. A room or queue number is not a patient identifier.','teal','shield')}</div></div></div>`}
function sectionHead(icon,title,tail=''){return`<div class="section-title between"><div class="flex gap6">${I(icon)}<h3>${title}</h3></div>${tail}</div>`}
function visitPage(){let p=patient();if(!p)return patientPage();let ap=getBooking(R.appointmentId)||p.appointment,locked=R.visit.source==='Appointment'&&!!ap;return`${errorsBox()}<div class="workspace"><section class="panel"><div class="panel-head"><div><h2>Give this visit its context</h2><p>Keep the appointment details or choose a walk-in pathway.</p></div>${badge('AMB · Outpatient','teal')}</div><div class="panel-pad"><div class="choice-cards">${[['Appointment','calendar','Prefill from booking'],['Walk-in','walk','No booking needed'],['Referral','link','External / internal']].map(([s,i,sub])=>`<button class="choice ${R.visit.source===s?'active':''}" data-action="source" data-value="${s}" ${s==='Appointment'&&!bookingAllowed(ap)?'disabled':''}>${I(i)}<span><strong>${s}</strong><small>${sub}</small></span>${R.visit.source===s?I('check'):''}</button>`).join('')}</div>${locked?`<div class="notice teal mt14">${I('calendar')}<div><strong>${esc(ap.id)} · ${esc(ap.time)} · ${fmtDate(ap.date)}</strong>Appointment remains a separate record and will be linked to the new encounter.</div></div>`:''}<div class="grid3 visit-fields mt14">${sel('Visit template <span class="required">*</span>','visit.template',Object.keys(templates),R.visit.template,locked?'disabled':'')}${sel('Visit purpose','visit.purpose',['New problem','Follow-up','Chronic care review','Post-operative review','Antenatal review','Therapy session','Second opinion','Preventive care','Immunization'],R.visit.purpose)}${sel('Specialty / service <span class="required">*</span>','visit.specialty',providers.map(p=>p.specialty),R.visit.specialty,locked?'disabled':'')}${sel('Responsible provider <span class="required">*</span>','visit.provider',providers.filter(x=>x.specialty===R.visit.specialty).map(x=>[x.id,x.name]),R.visit.provider,locked?'disabled':'')}<div class="span2">${field('Reason for visit <span class="required">*</span>','visit.reason',R.visit.reason,'text','maxlength="240" placeholder="Patient’s reason, not an assumed diagnosis"')}<div class="chips mt8">${['New concern','Routine follow-up',templates[R.visit.template]?.reason||'Review'].map(x=>`<button class="chip" data-action="reason" data-value="${esc(x)}">${esc(x)}</button>`).join('')}</div></div>${field('Clinic / room','visit.clinic',R.visit.clinic)}${sel('Visit priority','visit.priority',['Routine','Priority assistance','Urgent clinical review'],R.visit.priority)}</div>${R.visit.priority==='Urgent clinical review'?`<div class="mt14">${notice('<strong>Do not wait for registration or payment</strong>Request an immediate clinical assessment. Use the urgent handoff action if ED care is needed.','red','alert')}</div>`:''}<div class="rule"></div>${sectionHead('link','Episode, case & continuity',badge('Optional'))}<div class="grid2">${sel('Episode of care','visit.episode',[['','No episode linked'],...p.episodes.map(e=>[e.id,e.name])],R.visit.episode)}${sel('Managed case','visit.caseId',[['','No case linked'],...p.cases.map(c=>[c.id,c.name])],R.visit.caseId)}</div><div class="between mt8"><span class="small muted">Link only when this visit belongs to that care pathway.</span>${B(I('plus')+'Add link','new-link','link')}</div>${R.visit.template==='Physiotherapy'?`<div class="grid2 mt14">${field('Session number','visit.session',R.visit.session,'number','min="1" max="999"')}${field('Care-plan / previous encounter reference','visit.priorEncounter',R.visit.priorEncounter)}</div>`:''}${R.visit.template==='Post-operative'?`<div class="mt14">${field('Original procedure / encounter reference','visit.procedureRef',R.visit.procedureRef,'text','placeholder="Reference the earlier surgery or discharge record"')}</div>`:''}${['Screening','Vaccination'].includes(R.visit.template)?`<div class="mt14">${field('Program / clinic campaign','visit.program',R.visit.program)}</div>`:''}<details ${R.visit.source==='Referral'?'open':''}><summary>Referral, supporting documents & additional visit details</summary><div class="details-body"><div class="grid2">${sel('Referral source','visit.referralSource',['Self','Internal clinician','External clinician','Employer','Hospital','Other'],R.visit.referralSource)}${field('Referring provider / organization','visit.referrer',R.visit.referrer)}${field('Referral reference','visit.referralNumber',R.visit.referralNumber)}${field('Referral valid through','visit.referralValid',R.visit.referralValid,'date')}${field('Document reference (metadata only)','visit.document',R.visit.document,'text','placeholder="No file upload in this offline demo"')}${field('Structured reason code (optional)','visit.reasonCode',R.visit.reasonCode,'text','placeholder="Terminology service integration required"')}${field('Encounter date','visit.date',R.visit.date,'date',`min="${DAY}" max="${DAY}"`)}${sel('Visit mode','visit.mode',['In person','Remote appointment'],R.visit.mode)}</div></div></details></div></section><aside class="aside">${journeyAside()}<div class="panel"><div class="panel-pad">${sectionHead('users','Access & assistance')}<div class="stack">${sel('Interpreter needed','visit.interpreter',['No','Arabic','English','Malayalam','Hindi','Other'],R.visit.interpreter)}${sel('Assistance','visit.assistance',['None','Wheelchair / mobility','Hearing support','Visual support','Private waiting area','Other'],R.visit.assistance)}</div><div class="rule"></div><div class="detail-row"><span>Facility</span><strong>AllyVora Medical Centre</strong></div>${row('Branch',ctx.branch)}${row('Legal entity','AllyVora Demo Health')}${row('Tenant','ALLY-DEMO')}</div></div><div class="aside-note">${esc(templates[R.visit.template]?.hint||'Reception collects operational context. Specialty assessments belong to the care team.')}</div></aside></div>`}
function journeyAside(){let p=patient();return`<div class="panel"><div class="panel-pad"><span class="tiny">Visit at a glance</span><h3 class="mt8">${esc(R.visit.specialty)}</h3><p class="small muted mt8">${esc(provider().name)}</p><div class="rule"></div>${row('Arrival pathway',R.visit.source)}${row('Visit template',R.visit.template)}${row('Clinic',R.visit.clinic)}${row('Patient',p?.id||'Not selected')}${row('Episode',R.visit.episode||'Not linked')}<div class="rule"></div><div class="between"><span class="small muted">Sample consultation fee</span><strong class="amount">${amount(provider().fee)}</strong></div><p class="row-sub mt8">Illustrative tariff only. Not a payer quotation.</p></div></div>`}
function estTotals(){let gross=provider().fee+R.orders.filter(o=>o.status!=='Cancelled').reduce((s,o)=>s+o.price,0);return splitTotal(gross)}
function chargeLines(){let lines=[];if(R.consult.signed)lines.push({name:R.visit.template+' consultation',code:'DEMO-CONSULT',price:provider().fee});R.orders.filter(o=>o.status==='Completed').forEach(o=>lines.push({name:o.name,code:o.code,price:o.price}));return lines}
function splitTotal(gross){let discount=Math.min(Math.max(Number(R.discount)||0,0),gross);let net=Math.max(0,gross-discount),ded=Math.min(net,Math.max(Number(R.coverage.deductible)||0,0));let valid=R.coverage.responsibility==='Insurance'&&R.coverage.eligibility==='Eligible';let patientShare=valid?Math.round((ded+(net-ded)*(Number(R.coverage.rate)||0)/100)*100)/100:net;return{gross,discount,net,patient:patientShare,payer:Math.round((net-patientShare)*100)/100,paid:Math.round(R.payments.reduce((s,p)=>s+(p.void?0:p.amount),0)*100)/100}}
function actualTotals(){return splitTotal(chargeLines().reduce((s,o)=>s+o.price,0))}
function coveragePage(){let p=patient(),c=R.coverage,ins=c.responsibility==='Insurance',est=estTotals();return`${errorsBox()}<div class="workspace"><section class="panel"><div class="panel-head"><div><h2>Coverage, clarity and consent</h2><p>Financial verification and care readiness are tracked separately.</p></div>${badge('Demo checks only','amber')}</div><div class="panel-pad"><div class="choice-cards">${[['Insurance','shield'],['Self-pay','money'],['Corporate / sponsor','building'],['Package','layers']].map(([x,i])=>`<button class="choice ${c.responsibility===x?'active':''}" data-action="responsibility" data-value="${x}">${I(i)}<span><strong>${x}</strong></span></button>`).join('')}</div>${ctx.coverageCollapsed&&ins?`<div class="subpanel mt20"><div class="between"><div><h3>${esc(c.payer)}</h3><p class="row-sub">Member ••• ${esc(c.member.slice(-4))} · ${esc(c.network)}</p></div>${badge(c.eligibility,'teal')}</div><div class="between mt14"><span class="small muted">${esc(c.auth)} · ${esc(c.rate)}% sample copay · verified ${esc(c.verifiedAt)}</span>${B('Review details','expand-coverage','link')}</div></div>`:ins?`<div class="grid2 mt20">${sel('Primary payer <span class="required">*</span>','coverage.payer',['Meridian Health — demo','Harbor Care — demo'],c.payer)}${field('Member ID <span class="required">*</span>','coverage.member',c.member)}${field('Policy expiry','coverage.expiry',c.expiry,'date')}${field('Network','coverage.network',c.network)}</div><div class="subpanel mt14"><div class="between"><div class="flex">${I('shield')}<div><h3 style="font-size:12px">Eligibility</h3><p class="row-sub">${c.verifiedAt?'Demo response · '+esc(c.verifiedAt):'Not verified for this encounter'}</p></div>${badge(c.eligibility,c.eligibility==='Eligible'?'teal':c.eligibility==='Ineligible'?'red':'amber')}</div>${B(I('refresh')+(c.verifiedAt?'Recheck':'Check eligibility'),'eligibility','soft')}</div>${c.eligibility!=='Eligible'&&c.verifiedAt?`<p class="small mt8 status-warn">${c.eligibility==='Pending'?'Simulated payer timeout. Do not assume coverage.':'This synthetic member is not eligible. Resolve coverage or document a pending financial task.'}</p>`:''}</div><div class="grid3 mt14">${field('Copay % · sample benefit','coverage.rate',c.rate,'number','min="0" max="100" step="1"')}${field('Deductible · AED','coverage.deductible',c.deductible,'number','min="0" step="0.01"')}${sel('Authorization','coverage.auth',['Not required','Pending','Approved','Denied'],c.auth)}</div>${c.auth==='Approved'||R.visit.template==='Physiotherapy'?`<div class="subpanel mt14"><div class="grid3">${field('Authorization reference','coverage.authId',c.authId)}${field('Valid from','coverage.authFrom',c.authFrom,'date')}${field('Valid through','coverage.authTo',c.authTo,'date')}${field('Approved sessions','coverage.approved',c.approved,'number','min="0" max="999"')}${field('Previously used sessions','coverage.used',c.used,'number','min="0" max="999"')}<div class="field"><label>Remaining</label><div class="receipt-total" style="padding:10px"><b>${Math.max(0,Number(c.approved)-Number(c.used))}</b> demo sessions</div></div></div><p class="row-sub mt8">Verify dates, authorized service and visit limits against a real payer response in production.</p></div>`:''}<details ${financialIssues().length?'open':''}><summary>Secondary cover, guarantor & unresolved coverage</summary><div class="details-body"><div class="grid2">${field('Secondary cover reference','coverage.secondary',c.secondary)}${field('Guarantor','coverage.guarantor',c.guarantor)}<div class="span2">${area('Pending financial follow-up reason','coverage.pendingReason',c.pendingReason,'placeholder="Explain the issue, owner and next action"')}</div></div><p class="row-sub mt8">Secondary benefit coordination is not calculated in this prototype.</p></div></details>`:c.responsibility==='Corporate / sponsor'?`<div class="grid2 mt20">${field('Sponsor / employer <span class="required">*</span>','coverage.sponsor',c.sponsor)}${field('Guarantee / undertaking reference','coverage.guarantor',c.guarantor)}</div>`:c.responsibility==='Package'?`<div class="mt20">${field('Package / entitlement reference <span class="required">*</span>','coverage.package',c.package)}<div class="mt8">${notice('The prototype captures package context only. Entitlements and financial allocation need a package engine.','amber')}</div></div>`:`<div class="mt14">${notice('Self-pay selected. Review the sample estimate with the patient; no payment is collected at registration.','teal','money')}</div>`}<div class="rule"></div>${sectionHead('file','Consent & privacy records',badge('Review existing records'))}<div class="grid2">${sel('Treatment consent · facility workflow','consent.treatment',[['not-recorded','Not recorded'],['accepted','Accepted — recorded'],['deferred','Defer to clinical review'],['declined','Declined']],R.consent.treatment)}${sel('Privacy notice','consent.privacy',[['not-recorded','Not recorded'],['acknowledged','Notice provided & acknowledged'],['declined','Notice provided; acknowledgment declined'],['deferred','Delivery / acknowledgment pending']],R.consent.privacy)}</div><div class="grid2 mt14">${sel('Communication preference','consent.communication',['Portal only','SMS notification only','Email notification only','Printed documents','No digital contact'],R.consent.communication)}${field('Representative / guardian', 'consent.representative',R.consent.representative,'text',age(p.dob)<18?'placeholder="Required for this minor in demo workflow"':'placeholder="When applicable"')}</div>${['deferred','declined'].includes(R.consent.treatment)||['deferred','declined'].includes(R.consent.privacy)||R.visit.mode==='Remote appointment'?`<div class="mt14">${area('Exception / clinical-review reason','consent.note',R.consent.note,'placeholder="Document the patient’s choice and next action"')}</div>`:''}${check('I reviewed the consent record and its applicability','consent.reviewed',R.consent.reviewed,'Recording a choice here is a demo attestation, not a legally validated e-signature.')}<details><summary>Consent evidence & optional communications</summary><div class="details-body"><div class="grid2">${field('Form / version reference','consent.form',R.consent.form)}${field('Interpreter / witness reference','consent.interpreter',R.consent.interpreter)}</div>${check('Optional marketing opt-in','consent.marketing',R.consent.marketing,'Never required for registration or treatment.')}${B('View demo privacy notice','privacy-notice','link')}</div></details></div></section><aside class="aside"><div class="panel"><div class="panel-pad"><span class="tiny">Before services · sample estimate</span><div class="mt14"><span class="small muted">Estimated patient responsibility</span><div class="amount large mt8">${amount(est.patient)}</div></div><div class="rule"></div>${row('Consultation estimate',amount(provider().fee))}${row('Estimated payer share',amount(est.payer))}${row('Payment collected','None at check-in')}<div class="rule"></div>${notice('Estimate only. Eligibility is not a payment guarantee. Final charges follow documented care.','amber','info')}</div></div><div class="panel"><div class="panel-pad">${sectionHead('shield','Keep care moving')}<p class="definition">Payer errors create a visible financial follow-up task, not an assumption of coverage. Urgent symptoms must be escalated without waiting for billing.</p><div class="mt14">${B(I('alert')+'Urgent clinical handoff','urgent','danger full')}</div></div></div><div class="aside-note">Privacy-notice acknowledgment is separate from treatment consent. A declined acknowledgment is documented, not treated as a blanket refusal of care.</div></aside></div>`}
function identityErrors(){let e=[];if(!R.patientId)e.push('Select or register a patient.');if(R.patientId&&(!R.ident.name||!R.ident.dob))e.push('Confirm the patient’s full name and date of birth.');if(patient()&&age(patient().dob)<18&&!R.ident.guardian)e.push('Verify the guardian / representative.');return e}
function visitErrors(){let e=[];if(!R.visit.reason.trim())e.push('Enter the patient’s reason for this visit.');if(!providers.some(p=>p.id===R.visit.provider&&p.specialty===R.visit.specialty))e.push('Select a provider in the chosen specialty.');if(!R.visit.clinic.trim())e.push('Select the care location / clinic.');if(R.visit.source==='Referral'&&!R.visit.referrer.trim())e.push('Record the referring provider or organization.');if(R.visit.referralValid&&R.visit.referralValid<DAY)e.push('The referral is expired. Correct it or route for review.');if(R.visit.source==='Appointment'&&!R.appointmentId)e.push('Select a valid appointment or choose walk-in.');if(R.visit.date!==DAY)e.push('Use the current demo clinic date for check-in.');return e}
function financialIssues(){let c=R.coverage,e=[];if(c.responsibility!=='Insurance')return e;if(c.eligibility!=='Eligible')e.push('Eligibility '+c.eligibility.toLowerCase());if(c.expiry&&c.expiry<DAY)e.push('Policy expired');if(['Pending','Denied'].includes(c.auth))e.push('Authorization '+c.auth.toLowerCase());if(c.auth==='Approved'){if(!c.authId.trim())e.push('Authorization reference missing');if(!c.authFrom||!c.authTo||c.authFrom>DAY||c.authTo<DAY)e.push('Authorization validity needs review');if(R.visit.template==='Physiotherapy'&&Number(c.used)>=Number(c.approved))e.push('Authorized sessions exhausted')}return e}
function coverageErrors(){let c=R.coverage,e=[];if(c.responsibility==='Insurance'){if(!c.payer.trim()||!c.member.trim())e.push('Record the payer and member ID.');if(Number(c.rate)<0||Number(c.rate)>100||!Number.isFinite(Number(c.rate)))e.push('Copay must be between 0 and 100%.');if(Number(c.deductible)<0)e.push('Deductible cannot be negative.');if(financialIssues().length&&!c.pendingReason.trim())e.push('Resolve coverage or document a pending financial follow-up reason.');if(Number(c.approved)<0||Number(c.used)<0)e.push('Session counts cannot be negative.')}if(c.responsibility==='Corporate / sponsor'&&!c.sponsor.trim())e.push('Record the sponsor / employer.');if(c.responsibility==='Package'&&!c.package.trim())e.push('Record the package reference.');if(!R.consent.reviewed)e.push('Review consent applicability and patient preferences.');if(R.consent.treatment==='not-recorded')e.push('Record a treatment consent decision or defer to clinical review with a reason.');if(R.consent.treatment==='declined')e.push('Treatment consent is declined. Refer to a clinician; do not register routine treatment without resolving this.');if(R.consent.privacy==='not-recorded')e.push('Record privacy-notice delivery or a documented pending action.');if((R.consent.treatment==='deferred'||['deferred','declined'].includes(R.consent.privacy))&&!R.consent.note.trim())e.push('Document the consent / privacy exception and next action.');if(patient()&&age(patient().dob)<18&&!R.consent.representative.trim())e.push('Record the verified representative for this minor.');if(R.visit.mode==='Remote appointment'&&!R.consent.note.toLowerCase().includes('remote'))e.push('Record the remote-care consent review in the exception / clinical-review note.');return e}
function registrationErrors(){return[...identityErrors(),...visitErrors(),...coverageErrors()]}
function reviewPage(){let p=patient(),c=R.coverage,issues=registrationErrors(),tasks=financialIssues(),episode=p.episodes.find(x=>x.id===R.visit.episode),caseRecord=p.cases.find(x=>x.id===R.visit.caseId);return`${errorsBox()}<div class="workspace"><section class="panel"><div class="panel-head"><div><h2>Everything in one final view</h2><p>Confirm the visit. We’ll create the encounter and route the care team.</p></div>${badge(issues.length?issues.length+' checks remaining':'Ready for check-in',issues.length?'amber':'teal')}</div><div class="panel-pad">${notice(issues.length?'Review the outstanding items before completing check-in.':'Patient identity and required visit details are ready. No duplicate encounter will be created by repeated clicks.',issues.length?'amber':'teal',issues.length?'info':'shield')}<div class="review-grid mt20"><div class="subpanel"><div class="between"><h3>Patient & identity</h3>${B('Edit','review-edit','link','data-step="1"')}</div>${row('Patient',p.name)}${row('MRN',p.id)}${row('Date of birth',fmtDate(p.dob))}${row('Identifiers',R.ident.name&&R.ident.dob?'Both confirmed':'Needs verification')}${row('Communication',R.consent.communication)}</div><div class="subpanel"><div class="between"><h3>Visit & care team</h3>${B('Edit','review-edit','link','data-step="2"')}</div>${row('Class / source','AMB · '+R.visit.source)}${row('Template',R.visit.template)}${row('Provider',provider().name)}${row('Location',R.visit.clinic+' · '+ctx.branch)}${row('Reason',R.visit.reason)}</div><div class="subpanel"><div class="between"><h3>Coverage & authorization</h3>${B('Edit','review-edit','link','data-step="3"')}</div>${row('Responsibility',c.responsibility)}${row('Payer',c.responsibility==='Insurance'?c.payer:'Not applicable')}${row('Eligibility',c.responsibility==='Insurance'?c.eligibility:'Not applicable')}${row('Authorization',c.auth)}${row('Estimated patient share',amount(estTotals().patient))}</div><div class="subpanel"><div class="between"><h3>Continuity & consent</h3>${B('Edit','review-edit','link','data-step="3"')}</div>${row('Episode',episode?.name||'No episode needed')}${row('Case',caseRecord?.name||'No case needed')}${row('Treatment consent',R.consent.treatment)}${row('Privacy notice',R.consent.privacy)}${row('Form reference',R.consent.form)}</div></div><div class="rule"></div>${sectionHead('pulse','Where should the patient go next?')}<div class="choice-cards"><button class="choice ${R.queue.nursing?'active':''}" data-action="routing" data-value="nurse">${I('heart')}<span><strong>Nursing assessment first</strong><small>Vitals, safety review & preparation</small></span>${R.queue.nursing?I('check'):''}</button><button class="choice ${!R.queue.nursing?'active':''}" data-action="routing" data-value="provider">${I('user')}<span><strong>Direct to care provider</strong><small>For an appropriate provider-led pathway</small></span>${!R.queue.nursing?I('check'):''}</button></div>${tasks.length?`<div class="mt14">${notice('<strong>Financial follow-up stays visible</strong>'+esc(tasks.join(' · '))+'<br>'+esc(c.pendingReason),'amber','money')}</div>`:''}${issues.length?`<div class="mt14 small status-warn">${issues.map(esc).join('<br>')}</div>`:''}<div class="mt20 small muted">Check-in creates a unique encounter, records arrival, links (rather than replaces) the appointment, and adds the visit to the branch worklist.</div></div></section><aside class="aside"><div class="panel"><div class="panel-pad"><span class="tiny">Readiness checklist</span><div class="mt14">${[['Patient identity',identityErrors().length===0],['Visit details',visitErrors().length===0],['Coverage & consent',coverageErrors().length===0],['Worklist routing',true]].map(([s,ok])=>`<div class="mini-task ${ok?'ok':''}"><span class="circle">${ok?I('check'):'!'}</span><span>${s}</span></div>`).join('')}</div><div class="rule"></div><p class="definition">No new encounter is created when a clinician begins a consultation. Assessments, orders, billing and checkout stay connected to this visit.</p></div></div><div class="panel"><div class="panel-pad">${sectionHead('clock','After check-in')}<div class="timeline"><div class="timeline-row"><strong>${R.queue.nursing?'Nursing worklist':'Provider worklist'}</strong><p>${esc(R.visit.clinic)}</p></div><div class="timeline-row"><strong>Consultation & services</strong><p>Role-specific workspaces</p></div><div class="timeline-row"><strong>Checkout & follow-up</strong><p>Independent clinical and financial status</p></div></div></div></div></aside></div>`}
function accessPanel(role,what){return`<div class="empty"><div class="empty-art">${I('lock')}</div><h3>${esc(what)} workspace</h3><p>This view is reserved for the ${esc(role.toLowerCase())} role in the demonstration.</p><div class="mt20">${B('Preview '+role+' role','switch-role','soft',`data-value="${role}"`)}</div><p class="row-sub mt14">UI role preview only. Production permissions must be enforced on the server.</p></div>`}
function carePage(){return`${errorsBox()}<div class="workspace"><div class="panel"><div class="tabs" role="tablist" aria-label="Visit workspaces">${[['overview','Overview','layers'],['nursing','Nursing','heart'],['consultation','Consultation','clipboard'],['orders','Orders & services','lab'],['billing','Billing','money'],['checkout','Checkout','logout']].map(([t,l,i])=>`<button class="tab ${ctx.tab===t?'active':''}" role="tab" aria-selected="${ctx.tab===t}" data-action="tab" data-value="${t}">${I(i)}${l}${t==='orders'&&R.orders.length?`<span class="pill">${R.orders.length}</span>`:''}</button>`).join('')}</div><div class="panel-pad" role="tabpanel">${ctx.tab==='overview'?overviewCare():ctx.tab==='nursing'?(nursing()?nursingCare():accessPanel('Nurse','Nursing')):ctx.tab==='consultation'?(clinical()?consultationCare():accessPanel('Clinician','Consultation')):ctx.tab==='orders'?(nursing()?ordersCare():accessPanel('Clinician','Orders and services')):ctx.tab==='billing'?(finance()?billingCare():accessPanel('Billing','Billing')):checkoutCare()}</div></div><aside class="aside care-sidebar">${careAside()}</aside></div>`}
function overviewCare(){return`<div class="between"><div><h2>${R.status==='Discharged'?'This visit is complete':'Checked in. Connected to care.'}</h2><p class="subtitle">${esc(R.id)} · ${esc(ctx.branch)} · ${esc(R.createdAt||'')}</p></div><span class="pill-icon">${I('check')}</span></div><div class="metric-cards mt20"><div class="metric-card"><span class="tiny">Visit status</span><strong>${esc(R.status)}</strong><p class="row-sub">${esc(R.queueStatus)}</p></div><div class="metric-card"><span class="tiny">Clinical documentation</span><strong>${R.consult.signed?'Signed':'Open'}</strong><p class="row-sub">${R.consult.signed?esc(R.consult.author):'Awaiting care provider'}</p></div><div class="metric-card"><span class="tiny">Patient balance</span><strong class="amount">${amount(Math.max(0,actualTotals().patient-actualTotals().paid))}</strong><p class="row-sub">Performed services only</p></div></div><div class="rule"></div>${sectionHead('pulse','Next best operational action')}<div class="subpanel"><div class="between wrap"><div><h3>${!R.queue.called?'Call the patient':!R.assessment.done&&R.queue.nursing?'Complete nursing assessment':!R.consult.signed?'Open the clinical consultation':'Review services & checkout'}</h3><p class="row-sub">${esc(provider().name)} · ${esc(R.visit.clinic)}</p></div>${!R.queue.called?B(I('bell')+'Call patient','call-patient','primary',R.status==='Discharged'?'disabled':''):B('Open workspace'+I('arrow'),'go-next-care','primary')}</div><div class="status-line"><span class="on"></span><span class="${R.queue.called?'on':''}"></span><span class="${R.assessment.done||R.assessment.skipped?'on':''}"></span><span class="${R.consult.signed?'on':''}"></span><span class="${R.status==='Discharged'?'on':''}"></span></div></div>${R.consent.treatment==='deferred'?`<div class="mt14">${notice('<strong>Treatment consent needs clinical review</strong>A clinician must resolve this before signing treatment documentation.','amber','file')}</div>`:''}${financialIssues().length?`<div class="mt14">${notice('<strong>Financial work item remains open</strong>'+esc(financialIssues().join(' · '))+'<br>'+esc(R.coverage.pendingReason),'amber','money')}</div>`:''}<div class="grid2 mt20"><div><h3 class="mb14">Visit timeline</h3><div class="timeline">${R.events.slice(0,6).map(e=>`<div class="timeline-row"><div class="between"><strong>${esc(e.title)}</strong><span class="row-sub">${e.time}</span></div><p>${esc(e.detail)}</p></div>`).join('')}</div></div><div class="subpanel"><h3>Care context</h3><div class="mt8">${row('Class / template','AMB · '+R.visit.template)}${row('Reason',R.visit.reason)}${row('Episode',R.visit.episode||'Not linked')}${row('Case',R.visit.caseId||'Not linked')}${row('Appointment',R.appointmentId||'Walk-in / referral')}${row('Interpreter',R.visit.interpreter)}${row('Assistance',R.visit.assistance)}</div></div></div>`}
function careAside(){let t=actualTotals();return`<div class="panel"><div class="panel-pad"><div class="between"><span class="tiny">Encounter navigator</span>${badge('AMB','teal')}</div><h3 class="mt14">${esc(R.visit.specialty)}</h3><p class="small muted mt8">${esc(provider().name)}</p><div class="rule"></div>${[['Identity verified',true,'overview'],['Checked in',true,'overview'],['Nursing assessment',R.assessment.done||R.assessment.skipped,'nursing'],['Clinical note signed',R.consult.signed,'consultation'],['Services addressed',R.orders.every(x=>['Completed','Cancelled'].includes(x.status)),'orders'],['Checkout completed',R.status==='Discharged','checkout']].map(([x,done,t])=>`<button class="mini-task full ${done?'ok':''}" style="background:none;text-align:left" data-action="tab" data-value="${t}"><span class="circle">${done?I('check'):I('clock')}</span><span>${x}</span></button>`).join('')}<div class="rule"></div>${row('Clinical status',R.status)}${row('Patient balance',amount(Math.max(0,t.patient-t.paid)))}${row('Claim status',R.claim.status)}<p class="row-sub mt14">Clinical completion does not wait for payer adjudication or non-urgent results with a documented follow-up owner.</p></div></div><div class="panel"><div class="panel-pad">${sectionHead('shield','Safety context')}<p class="definition">${nursing()?esc(patient().allergy):'Clinical details are limited in the registration role. Open a clinical role preview to review the patient’s care record.'}</p><div class="rule"></div>${row('Consent',R.consent.treatment)}${row('Identity review',R.consult.identity?'Reconfirmed for care':'Required before signing')}${B(I('alert')+'Urgent handoff','urgent','danger full mt14')}</div></div>`}
function readonlyClinical(){return R.status==='Discharged'?'disabled':''}
function nursingCare(){let a=R.assessment,off=readonlyClinical();return`<div class="between"><div><h2>Nursing assessment</h2><p class="subtitle">Document the initial assessment within this encounter.</p></div>${badge(a.done?'Recorded':a.skipped?'Direct-to-provider':'Not recorded',a.done?'teal':'amber')}</div><div class="mt14">${notice('Demonstration fields only. Use validated clinical protocols and devices in production.','blue','info')}</div><div class="grid3 mt20">${field('Systolic BP · mmHg','assessment.bpSys',a.bpSys,'number',`min="20" max="350" ${off}`)}${field('Diastolic BP · mmHg','assessment.bpDia',a.bpDia,'number',`min="10" max="250" ${off}`)}${field('Pulse · /min','assessment.pulse',a.pulse,'number',`min="10" max="350" ${off}`)}${field('Temperature · °C','assessment.temperature',a.temperature,'number',`min="25" max="45" step="0.1" ${off}`)}${field('SpO₂ · %','assessment.spo2',a.spo2,'number',`min="0" max="100" ${off}`)}${field('Pain score · 0–10','assessment.pain',a.pain,'number',`min="0" max="10" ${off}`)}${field('Weight · kg','assessment.weight',a.weight,'number',`min="0.1" max="500" step="0.1" ${off}`)}${field('Height · cm','assessment.height',a.height,'number',`min="20" max="260" step="0.1" ${off}`)}<div class="field"><label>BMI · kg/m² (calculated)</label><div class="subpanel" id="bmi" style="padding:10px">${bmi()}</div></div></div><div class="rule"></div>${sectionHead('shield','Medication & allergy reconciliation')}<div class="grid2">${area('Allergy status / details','assessment.allergy',a.allergy,off)}${area('Current medications / reconciliation','assessment.meds',a.meds,off)}</div><div class="grid2">${check('Allergy record reviewed','assessment.allergyReviewed',a.allergyReviewed,'Do not interpret an empty record as no allergies.',off)}${check('Medication list reviewed','assessment.medsReviewed',a.medsReviewed,'Record the source and unresolved differences.',off)}</div>${area('Risk screening / observations / assistance','assessment.screening',a.screening,`placeholder="Infection precautions, falls risk, safeguarding or other relevant observations" ${off}`)}<div class="between mt20 wrap"><span class="small muted">Assessment belongs to ${esc(R.id)}</span><div class="flex">${B('Save assessment','save-assessment','primary',off)}${B('Continue to provider','nurse-to-provider','',off)}</div></div>`}
function bmi(){let h=Number(R.assessment.height),w=Number(R.assessment.weight);return h>0&&w>0?(w/((h/100)**2)).toFixed(1):'Enter height and weight'}

ount(p.amount)}${p.void?'</s>':''}</strong>${!p.void?B('Reverse','reverse-payment','sm',`data-id="${p.id}" ${ctx.role==='Supervisor'?'':'disabled'}`):badge('Reversed')}</div></div>`).join('')}`:''}<div class="rule"></div>${sectionHead('shield','Claim preparation',badge(R.claim.status,R.claim.status==='Demo submitted'?'teal':'blue'))}<p class="definition">Review documentation, diagnosis, service codes, authorization and payer details. Demo codes are not valid claim codes; no payer receives this claim.</p><div class="flex mt14 wrap">${B('Build claim draft','claim-build','')}${B('Validate demo claim','claim-validate','',R.claim.status==='Not prepared'?'disabled':'')}${B('Simulate submission','claim-submit','soft',R.claim.status!=='Demo validated'?'disabled':'')}</div>${R.claim.errors?.length?`<div class="notice amber mt14"><div>${R.claim.errors.map(esc).join('<br>')}</div></div>`:''}<div class="mt14">${notice('Clinical discharge is independent of payment collection and payer adjudication. Any unpaid amount remains an explicit financial task.','teal','info')}</div>`}

function checkoutCare(){let f=R.followup,pending=openOrders(),closed=R.status==='Discharged',off=closed?'disabled':'';return`<div class="between wrap"><div><h2>${closed?'Visit complete. Continuity preserved.':'A clear finish, a clear next step.'}</h2><p class="subtitle">Follow-up, pending results and patient documents.</p></div>${badge(closed?'Completed':R.consult.signed?'Clinical note signed':'Clinical note pending',R.consult.signed?'teal':'amber')}</div><div class="grid2 mt20">${sel('Follow-up plan','followup.needed',['Recommended','Not required','Patient declined'],f.needed,off)}${sel('Disposition','followup.disposition',['Home / self-care','Referred to another service','Referred for ED assessment','Admission requested','Transferred to another facility','Left before completion'],f.disposition,off)}</div>${f.needed==='Recommended'?`<div class="subpanel mt14"><div class="between mb14"><h3>Follow-up appointment</h3>${badge(f.booked?'Booked · demo':'Not booked',f.booked?'teal':'amber')}</div><div class="grid3">${field('Date','followup.date',f.date,'date',`min="${DAY}" ${f.booked?'disabled':off}`)}${field('Time','followup.time',f.time,'time',f.booked?'disabled':off)}${sel('Provider','followup.provider',providers.map(p=>[p.id,p.name]),f.provider,f.booked?'disabled':off)}</div><div class="between mt14"><span class="small muted">${f.booked?esc(f.id)+' · retained in the in-memory schedule':'Checks for another demo booking at the same time.'}</span>${B(I('calendar')+'Book follow-up','book-followup','soft',(f.booked||closed)?'disabled':'')}</div></div>`:''}<div class="mt14">${field('Referral / medical certificate / outside service reference','followup.referral',f.referral,'text',off)}</div><div class="rule"></div>${sectionHead('clock','Pending results & continuity',badge(pending.length+' open service'+(pending.length===1?'':'s'),pending.length?'amber':'teal'))}${pending.length?`<div class="mt8">${notice(pending.map(x=>esc(x.name)+' — '+esc(x.status)).join('<br>'),'amber','lab')}</div><div class="grid2 mt14">${field('Responsible follow-up owner <span class="required">*</span>','followup.resultOwner',f.resultOwner,'text',off)}${field('Review due date <span class="required">*</span>','followup.resultDue',f.resultDue,'date',`min="${DAY}" ${off}`)}</div>`:`<p class="definition">No unresolved service orders for this visit.</p>`}<div class="mt14">${area('Follow-up actions / appointment exception / patient instructions','followup.plan',f.plan,`placeholder="Who will review outstanding work, when and how the patient will be informed?" ${off}`)}</div>${check('Visit instructions and return precautions reviewed with patient','followup.education',f.education,'Record teaching / understanding through the clinical documentation workflow.',off)}<div class="rule"></div>${sectionHead('file','Patient documents & communication')}<div class="choice-cards"><button class="choice" data-action="documents">${I('file')}<span><strong>Visit summary & orders</strong><small>Preview before printing</small></span></button><button class="choice" data-action="invoice">${I('money')}<span><strong>Invoice & payment record</strong><small>Sample charges only</small></span></button><button class="choice" data-action="prepare-communication">${I('mail')}<span><strong>Prepare handoff</strong><small>${esc(R.consent.communication)}</small></span></button></div>${f.documentsPrepared?`<div class="mt14">${notice('Patient handoff prepared in this browser tab. No email, SMS, portal notification or document has been sent.','teal','mail')}</div>`:''}${closed?`<div class="mt20">${notice('Clinical encounter completed. Results and financial tasks retain their own status. Readmissions and future appointments use their own encounters.','teal','check')}</div>`:`<div class="mt20">${notice('Completing the encounter is a clinical action. Signed documentation and a safe follow-up plan are required; payment is not a clinical completion gate.','blue','shield')}</div>`}`}
let lastFocus=null,modalType='',orderCategory='All',orderQuery='',chosenOrder=null,scheduleQuery='',scheduleDate=DAY,editingPatient=false,allowDuplicate=false;
function modal(title,subtitle,body,foot='',wide=false){lastFocus=document.activeElement;let d=$('#modal');d.className=wide?'modal-wide':'';d.innerHTML=`<div class="dialog-head"><div><h2 id="dialog-title">${title}</h2><p>${subtitle}</p></div><button class="icon-btn" data-action="close-modal" aria-label="Close dialog">${I('close')}</button></div><div class="dialog-body"><div class="dialog-error error-box" role="alert"></div>${body}</div>${foot?`<div class="dialog-foot">${foot}</div>`:''}`;if(!d.open)d.showModal();requestAnimationFrame(()=>{let el=d.querySelector('[autofocus]');if(el)el.focus()})}
function closeModal(){if($('#modal').open)$('#modal').close();modalType='';if(lastFocus?.isConnected)lastFocus.focus()}
function modalError(msg){let el=$('#modal .dialog-error');if(el){el.classList.add('show');el.innerHTML=esc(msg);el.scrollIntoView({block:'nearest'})}else toast(msg,true)}
function mv(name){let el=$(`#modal [name="${name}"]`);return el?(el.type==='checkbox'?el.checked:el.value):''}
function getModalValues(prefix){let out={};$('#modal').querySelectorAll('input[name],select[name],textarea[name]').forEach(el=>{if(el.name.startsWith(prefix+'.'))out[el.name.slice(prefix.length+1)]=el.type==='checkbox'?el.checked:el.value.trim()});return out}
function patientModal(edit=false){editingPatient=edit;allowDuplicate=false;modalType='patient';let p=edit?patient():{};modal(edit?'Update patient details':'Create a patient record','Synthetic data only · demographic record first, encounter second',`<div class="grid2">${field('Full legal name <span class="required">*</span>','np.name',p.name||'','text','maxlength="120" autofocus')}${field('Date of birth <span class="required">*</span>','np.dob',p.dob||'','date',`max="${DAY}" min="1900-01-01"`)}${sel('Administrative sex','np.sex',['Unknown','Female','Male','Other'],p.sex||'Unknown')}${sel('Identity document type','np.idType',['National ID','Passport','Other','Not available'],p.idType||'National ID')}${field('Document / identifier','np.identifier',p.identifier||'','text','placeholder="Use a DEMO- identifier" maxlength="60"')}${field('Mobile','np.phone',p.phone||'','tel','placeholder="+971 …" maxlength="30"')}${field('Email','np.email',p.email||'','email','placeholder="name@example.invalid" maxlength="140"')}${sel('Preferred language','np.language',['English','Arabic','Malayalam','Hindi','Other'],p.language||'English')}</div><details><summary>Address, representative, emergency contact & preferences</summary><div class="details-body"><div class="grid2">${field('Address','np.address',p.address||'')}${field('Nationality (optional)','np.nationality',p.nationality||'')}${field('Representative / guardian','np.guardian',p.guardian||'')}${field('Relationship','np.relationship',p.relationship||'')}${field('Emergency contact','np.emergencyContact',p.emergencyContact||'')}${field('Emergency contact mobile','np.emergencyPhone',p.emergencyPhone||'','tel')}${sel('Preferred contact channel','np.contactPreference',['Portal only','Phone','Printed documents','No digital contact'],p.contactPreference||'Portal only')}${field('Duplicate-resolution reason (supervisor only)','np.duplicateReason','','text',ctx.role==='Supervisor'?'':'disabled')}</div></div></details><div id="duplicate-check" class="mt14"></div><div class="mt14">${notice('A missing mobile number or identity document does not create a new identity automatically. Use the approved patient-identification process.','blue','shield')}</div>`,`${B('Cancel','close-modal')}${B(edit?'Save patient updates':'Create patient & continue','save-patient','primary')}`)}
function savePatient(){let v=getModalValues('np');if(!v.name||!v.dob)return modalError('Enter the full name and date of birth.');if(v.dob>DAY||v.dob<'1900-01-01')return modalError('Enter a valid date of birth before or on the demo clinic day.');if(v.email&&!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v.email))return modalError('Enter a valid email address or leave it blank.');if(v.phone&&(v.phone.replace(/\D/g,'').length<8||v.phone.replace(/\D/g,'').length>15))return modalError('Use 8–15 digits for a mobile number, or leave it blank.');let matches=patients.filter(p=>(!editingPatient||p.id!==R.patientId)&&((v.identifier&&norm(p.identifier)===norm(v.identifier))||(p.dob===v.dob&&norm(p.name).includes(norm(v.name.split(' ')[0])))));if(matches.length&&!(ctx.role==='Supervisor'&&v.duplicateReason.trim().length>10)){$('#duplicate-check').innerHTML=notice('<strong>Possible duplicate — review before creating</strong>'+matches.map(p=>`<div class="between mt8"><span>${esc(p.name)} · ${esc(p.id)} · ${fmtDate(p.dob)}</span>${B('Use existing','duplicate-use','sm',`data-id="${p.id}"`)}</div>`).join('')+'<div class="mt8 small">Only a supervisor may create a distinct record after documenting why the match is not the same patient.</div>','amber','users');return modalError('Possible duplicate found. Review the existing patient instead of automatically creating another record.')}if(matches.length)log('Duplicate override documented','New demographic record');if(editingPatient){Object.assign(patient(),v);R.ident={name:false,dob:false,guardian:false};log('Demographics updated; identity recheck required');closeModal();render();toast('Patient details updated. Reconfirm identity.')}else{let p={...v,id:'DEMO-'+(1001+patients.length),color:'lilac',payer:'',member:'',eligibility:'Pending',episodes:[],cases:[],alerts:[],allergy:'Unknown — verify with patient',meds:'Not reconciled',consent:'not-recorded',privacy:'not-recorded',appointment:null};patients.push(p);log('Patient demographic record created',p.id);closeModal();selectPatient(p.id);toast('Patient record created. Verify two identifiers to continue.')}}
function choosePatient(id,apid=''){if(R.id){return modal('Start another registration?','Your existing encounter stays in the worklist.',`<p class="definition">The current encounter will remain available. A new registration will use the patient you selected.</p>`,B('Cancel','close-modal')+B('Continue','confirm-select','primary',`data-id="${id}" data-apid="${apid}"`))}if(R.patientId&&R.patientId!==id&&(ctx.step>1||R.ident.name||R.ident.dob)){return modal('Switch the selected patient?','Prevent information from being assigned to the wrong patient.',notice('This registration will be saved as an in-memory draft. The new patient starts with a separate, unverified identity.','amber','users'),B('Stay here','close-modal')+B('Save draft & switch','confirm-select','primary',`data-id="${id}" data-apid="${apid}"`))}selectPatient(id,apid)}
function selectPatient(id,apid=''){let p=patients.find(p=>p.id===id);if(!p)return;R=blank();R.patientId=id;R.coverage.payer=p.payer||'Meridian Health — demo';R.coverage.member=p.member||'';R.coverage.responsibility=p.payer?'Insurance':'Self-pay';R.consent.treatment=p.consent;R.consent.privacy=p.privacy;R.consent.representative=p.guardian||'';R.consent.communication=p.contactPreference||'Portal only';R.assessment.allergy=p.allergy;R.assessment.meds=p.meds;let ap=apid?getBooking(apid):ctx.filter!=='walk-in'&&bookingAllowed(p.appointment)?p.appointment:null;if(ap){R.appointmentId=ap.id;R.visit.source='Appointment';applyTemplate(ap.template);R.visit.provider=ap.provider;R.visit.specialty=providers.find(x=>x.id===ap.provider).specialty;R.visit.clinic=provider().room;R.visit.reason=ap.reason;R.visit.date=ap.date;R.followup.provider=ap.provider}else{R.visit.source='Walk-in';R.visit.reason='General consultation'}R.followup.provider=R.visit.provider;ctx.step=1;ctx.errors=[];ctx.coverageCollapsed=false;log('Patient record accessed',id);render()}
function applyTemplate(name){let t=templates[name];if(!t)return;R.visit.template=name;R.visit.specialty=t.specialty;let pr=providers.find(p=>p.specialty===t.specialty);R.visit.provider=pr.id;R.visit.clinic=pr.room;R.visit.purpose=t.purpose;R.visit.reason=t.reason;R.followup.provider=pr.id;R.visit.episode='';R.visit.caseId='';if(name==='Physiotherapy'){R.coverage.auth='Pending';R.coverage.authId=''}else{R.coverage.auth='Not required'}R.coverage.eligibility='Not checked';R.coverage.verifiedAt='';ctx.coverageCollapsed=false}
function bookingAllowed(ap){return !!ap&&ap.date===DAY&&(ap.branch||'Central OP')===ctx.branch&&ap.status==='Booked'}
function allBookings(){return[...patients.filter(p=>p.appointment).map(p=>({...p.appointment,patientId:p.id})),...appointments]}
function getBooking(id){let p=patients.find(p=>p.appointment?.id===id);return p?p.appointment:appointments.find(a=>a.id===id)}
function scheduleModal(){modalType='schedule';scheduleQuery='';scheduleDate=DAY;modal('Appointment desk','Demo clinic day · 10 September 2026 · appointments remain separate from encounters',`<div class="grid2"><div class="searchbox">${I('search')}<input id="schedule-search" aria-label="Search appointments" placeholder="Patient, booking, provider or specialty" autofocus></div>${field('Date','schedule.date',scheduleDate,'date')}</div><div id="schedule-results" class="mt20">${scheduleResults()}</div>`,B(I('plus')+'Book appointment','book-appointment','soft'),true)}

assigned')} · ${fmtDate(R.followup.resultDue)}</p>`:''}<h3>Documentation status</h3><p>${R.consult.signed?'Demo signature: '+esc(R.consult.author)+' · '+esc(R.consult.signedAt):'Unsigned draft — not a completed clinical record'}</p>${R.consult.addenda.length?`<h3>Addenda</h3><p>${R.consult.addenda.map(a=>esc(a.author)+' · '+a.time+'\n'+esc(a.text)).join('\n\n')}</p>`:''}`}<div class="rule"></div><div class="notice amber"><div>DEMONSTRATION ONLY. Not a valid prescription, medical certificate, insurance claim, fiscal invoice or evidence of payment. All names, codes and amounts are synthetic.</div></div></div>`}
function documentModal(invoice=false){if(!R.id)return toast('Register an encounter before generating documents.',true);if(invoice&&!['Registration','Billing','Supervisor'].includes(ctx.role))return toast('Use the Registration, Billing or Supervisor role for financial documents.',true);if(!invoice&&!clinical()&&ctx.role!=='Nurse')return toast('Use the Clinician, Nurse or Supervisor role to prepare clinical documents.',true);modalType=invoice?'invoice':'documents';log(invoice?'Invoice preview opened':'Clinical document preview opened');modal(invoice?'Invoice preview':'Patient visit documents','Review the patient and contents before printing or exporting.',documentsMarkup(invoice),B('Close','close-modal')+B(I('download')+'Export demo text','export-document','',`data-invoice="${invoice}"`)+B(I('print')+'Print','print-document','primary',`data-invoice="${invoice}"`),true)}

function workflowMap(){let mapping=[['Arrival / connection',1,'overview'],['Patient search',1,'overview'],['New patient & MRN',1,'overview'],['Verify / update identity',1,'overview'],['Appointment / walk-in selection',2,'overview'],['Encounter class = ambulatory',2,'overview'],['Encounter template',2,'overview'],['Visit purpose',2,'overview'],['Chief complaint / reason',2,'overview'],['Specialty / service',2,'overview'],['Provider / responsible team',2,'overview'],['Facility / branch / clinic',2,'overview'],['Episode / case linkage',2,'overview'],['Referral & document references',2,'overview'],['Payer / eligibility',3,'overview'],['Authorization / session limits',3,'overview'],['Financial responsibility / estimate',3,'billing'],['Consent & privacy records',3,'overview'],['Operational / safety alerts',1,'nursing'],['Create unique OP encounter',4,'overview'],['Arrival / queue state',4,'overview'],['Route to clinical worklist',4,'overview'],['Nursing assessment / vitals',5,'nursing'],['Clinical consultation / scoring references',5,'consultation'],['Orders / performed services',5,'orders'],['Charges / billing / payment',5,'billing'],['Follow-up / referral',5,'checkout'],['Clinical encounter completion',5,'checkout'],['Coding / claim preparation',5,'billing'],['Visit documents / patient handoff',5,'checkout']];modal('All 30 workflow steps','Grouped into four registration steps and one role-based care workspace.',`<div class="grid2">${mapping.map(([n,s,t],i)=>`<div class="link-card"><div><b class="small">${String(i+1).padStart(2,'0')} · ${n}</b><div class="row-sub">${stepNames[s-1][0]}</div></div>${B('Open','map-open','sm',`data-step="${s}" data-tab="${t}" ${s===5&&!R.id?'disabled':''}`)}</div>`).join('')}</div>`,B('Close','close-modal'),true)}
function complianceModal(){modal('Safety & deployment readiness','Design support, not a HIPAA certification or a JCI accreditation claim.',`${notice('<strong>Not for real patient information</strong>This standalone HTML is an offline prototype. It has no secure backend, verified staff identity, production audit trail, payer connection or validated e-signature.','amber','shield')}<h3 class="mt20 mb14">Implemented in this demonstration</h3><div class="grid2">${[['Patient identity','Two explicit identity checks; minor representative review; similar-record warnings.'],['Data handling','Synthetic records; no browser persistence; no analytics or network requests.'],['Workflow access','Role-specific UI previews; server enforcement is not implemented.'],['Privacy screen','Manual privacy curtain, inactivity lock, masked search identifiers.'],['Traceability','Timestamped, in-memory event list with role, branch and object references.'],['Clinical handoff','Visible alerts, consent exceptions, urgent handoff and pending-result ownership.'],['Record lifecycle','Appointment linked to encounter; no duplicate creation on repeated clicks; signed notes use addenda.'],['Financial separation','Clinical closure is not blocked by payment; pending financial work remains visible.']].map(([h,t])=>`<div class="subpanel"><h3>${h}</h3><p class="definition mt8">${t}</p></div>`).join('')}</div><h3 class="mt20 mb14">Required before real deployment</h3><div class="source-list"><p>1. Identity provider / SSO, appropriate MFA, server-side authorization, tenant / legal-entity / branch isolation, session revocation and governed emergency access.</p><p>2. TLS, protected databases and backups, encryption and key management, durable access and change auditing, monitoring, incident response and tested recovery.</p><p>3. Risk analysis; privacy and security policies; staff training; vendor / business-associate arrangements where applicable; retention, patient rights and breach processes.</p><p>4. Validated patient matching, consent / signature evidence, medication safety, clinician privileges, terminology, interoperability and production scheduling / payer connections.</p><p>5. Current JCI standards for the applicable accreditation program, facility policies, local healthcare / privacy rules and independent legal, security, clinical and accreditation review.</p></div><div class="rule"></div><h3>Official reference points</h3><div class="source-list mt8"><p><a href="https://www.hhs.gov/hipaa/for-professionals/security/laws-regulations/index.html" target="_blank" rel="noopener noreferrer">HHS — Summary of the HIPAA Security Rule</a></p><p><a href="https://www.hhs.gov/hipaa/for-professionals/privacy/laws-regulations/index.html" target="_blank" rel="noopener noreferrer">HHS — Summary of the HIPAA Privacy Rule</a></p><p><a href="https://www.jointcommission.org/en/standards/international-patient-safety-goals" target="_blank" rel="noopener noreferrer">JCI — International Patient Safety Goals</a></p></div><p class="row-sub mt14">Reviewed for this design: 10 September 2026. JCI goals vary by setting and accreditation program. This is not a full standards crosswalk.</p>`,B('Close','close-modal'),true)}

function saveDraft(silent=false){if(!R.patientId||R.id)return false;let k=drafts.findIndex(d=>d.patientId===R.patientId&&d.branch===R.branch);let copy=structuredClone(R);copy.savedAt=stamp();if(k>=0)drafts[k]=copy;else drafts.push(copy);log('Registration draft saved in memory');if(!silent)toast('Draft saved in this tab only. Refreshing will discard it.');return true}

function tryStep(step){if(R.id){if(step===5){ctx.step=5;ctx.errors=[];render()}return}if(step===1){ctx.step=1;ctx.errors=[];render();return}let e=identityErrors();if(step>=3)e.push(...visitErrors());if(step>=4)e.push(...coverageErrors());if(step===5)return;if(e.length){ctx.errors=[...new Set(e)];render();$('#errors')?.focus();return}ctx.errors=[];ctx.step=step;render();window.scrollTo({top:0,behavior:'instant'});$('#content').focus({preventScroll:true})}
function register(){if(R.id)return toast('This encounter is already registered.');if(!['Registration','Supervisor'].includes(ctx.role))return toast('Select the Registration or Supervisor role for check-in.',true);let e=registrationErrors();if(e.length){ctx.errors=e;render();$('#errors')?.focus();return}let duplicate=visits.find(v=>v.appointmentId&&v.appointmentId===R.appointmentId);if(duplicate){return modal('This appointment already has an encounter','No second encounter has been created.',notice(esc(duplicate.id)+' is already linked to this appointment.','amber','shield'),B('Open existing encounter','open-visit','primary',`data-id="${duplicate.id}"`))}let active=visits.find(v=>v.patientId===R.patientId&&v.branch===ctx.branch&&v.status!=='Discharged'&&v.visit.specialty===R.visit.specialty);if(active){return modal('An active visit already exists','Review the active encounter before starting another.',notice(esc(active.id)+' · '+esc(active.visit.specialty)+' · '+esc(active.queueStatus),'amber','users'),B('Open active encounter','open-visit','primary',`data-id="${active.id}"`))}R.id='ENC-OP-DEMO-'+(++sequence);R.createdAt=stamp();R.status='In progress';R.queueStatus=R.queue.nursing?'Waiting for nursing':'Waiting for provider';R.assessment.skipped=!R.queue.nursing;R.branch=ctx.branch;R.followup.financialTask=financialIssues().length>0;let ap=getBooking(R.appointmentId);if(ap){ap.status='Arrived';ap.encounterId=R.id}visits.push(R);let d=drafts.findIndex(d=>d.patientId===R.patientId&&d.branch===ctx.branch);if(d>=0)drafts.splice(d,1);event('Encounter checked in','Routed to '+R.visit.clinic+' · '+R.queueStatus);ctx.step=5;ctx.tab='overview';ctx.errors=[];render();window.scrollTo({top:0,behavior:'instant'});toast('Encounter '+R.id+' created and added to the worklist.')}

function assessmentSave(){if(!nursing()||R.status==='Discharged')return toast('This assessment is not editable in the current role or state.',true);let a=R.assessment,ranges={bpSys:[20,350],bpDia:[10,250],pulse:[10,350],temperature:[25,45],spo2:[0,100],weight:[.1,500],height:[20,260],pain:[0,10]};for(let k in ranges){if(a[k]!==''&&(!Number.isFinite(Number(a[k]))||Number(a[k])<ranges[k][0]||Number(a[k])>ranges[k][1]))return toast('Review the entered '+k+' value.',true)}if((a.bpSys&&!a.bpDia)||(!a.bpSys&&a.bpDia))return toast('Record both systolic and diastolic BP, or leave both blank.',true);if(a.bpSys&&Number(a.bpSys)<=Number(a.bpDia))return toast('Systolic BP must be greater than diastolic BP. Recheck the entry.',true);if(!a.allergyReviewed||!a.medsReviewed||!a.allergy.trim()||!a.meds.trim())return toast('Review and document allergy status and medication reconciliation.',true);a.done=true;a.doneAt=stamp();R.queueStatus='Ready for provider';event('Nursing assessment recorded','Medication and allergy reviews documented');render();toast('Assessment recorded; patient is ready for the provider.');return true}

case 'prepare-communication':if(!nursing())return toast('Use a clinical role to prepare patient instructions.',true);R.followup.documentsPrepared=true;event('Patient handoff prepared','Not sent; offline demonstration');render();toast('Handoff prepared. No message or document was transmitted.');break;
case 'complete':completeEncounter();break;
case 'confirm-complete':if(!clinical()||R.status==='Discharged')return;R.status='Discharged';R.queueStatus='Visit completed';R.completedAt=stamp();R.followup.financialTask=actualTotals().patient>actualTotals().paid||financialIssues().length>0;{let ap=getBooking(R.appointmentId);if(ap)ap.status='Fulfilled'}event('Encounter clinically completed',R.followup.disposition);closeModal();ctx.errors=[];ctx.tab='checkout';render();toast('Clinical encounter completed. Financial and result follow-up remain separate.');break;
case 'new-registration':modal('Start a new registration?','The current encounter remains in the worklist.',notice('You can reopen the existing visit from the clinical worklist. No data will be overwritten.','teal','users'),B('Stay here','close-modal')+B('New registration','confirm-new','primary'));break;
case 'confirm-new':if(!R.id&&R.patientId)saveDraft(true);R=blank();ctx.step=1;ctx.filter='appointments';ctx.query='';ctx.errors=[];ctx.tab='overview';ctx.coverageCollapsed=false;closeModal();render();break;
case 'urgent':urgentModal();break;
case 'confirm-urgent':{let reason=mv('urgent.reason').trim();if(!reason||!mv('urgent.external'))return modalError('Enter a reason and confirm that the real-world escalation was initiated outside this demo.');let h={patient:R.patientId||'Identity incomplete',encounter:R.id||'Not registered',time:stamp(),destination:mv('urgent.destination'),reason};handoffs.push(h);if(R.id){R.queueStatus='Urgent clinical review';event('Urgent handoff task recorded','Real-world response must be handled outside this demo')}else log('Urgent handoff recorded before registration',R.patientId||'Identity incomplete');closeModal();render();toast('Demo handoff recorded. This page has not contacted anyone.');break}
case 'notifications':modal('Operational follow-up','These notifications exist only in this browser session.',`<div class="stack">${notice(`${visits.filter(v=>v.branch===ctx.branch&&v.status!=='Discharged').length} active visits in this branch.`, 'teal','users')}${notice(`${visits.filter(v=>v.branch===ctx.branch&&v.followup.financialTask).length} visits have financial follow-up tasks.`, 'amber','money')}${notice(`${visits.filter(v=>v.branch===ctx.branch&&v.status==='Discharged'&&v.orders.some(o=>!['Cancelled','Completed'].includes(o.status))).length} completed visits have pending service follow-up.`, 'blue','lab')}${handoffs.map(h=>`<div class="subpanel"><b>${esc(h.destination)}</b><p class="row-sub">${esc(h.encounter)} · ${h.time}</p><p class="definition mt8">Demo handoff recorded; not transmitted.</p></div>`).join('')}</div>`,B('Open worklist','worklist','primary'));break;
case 'audit':auditModal();break;
case 'audit-export':if(ctx.role!=='Supervisor')return;downloadText('allyvora-demo-audit.json',JSON.stringify(audit,null,2),'application/json');log('Demo audit exported');break;
case 'confirm-branch':if(!R.id&&R.patientId)saveDraft(true);ctx.branch=val;R=blank();ctx.step=1;ctx.query='';ctx.errors=[];closeModal();log('Branch context changed');render();break;
default:toast('This action is unavailable in the current demo state.',true)
}}
function renderFocused(){let a=document.activeElement,name=a?.name,id=a?.id,start=a?.selectionStart,end=a?.selectionEnd;render();let el=id?document.getElementById(id):name?document.querySelector(`[name="${name}"]`):null;if(el){el.focus({preventScroll:true});if(typeof start==='number'&&typeof el.setSelectionRange==='function'){try{el.setSelectionRange(start,end)}catch{}}}}
function editAllowed(name){if(!R.id)return true;if(name.startsWith('assessment.'))return nursing()&&R.status!=='Discharged';if(name.startsWith('consult.'))return clinical()&&!R.consult.signed&&R.status!=='Discharged';if(name.startsWith('followup.'))return R.status!=='Discharged';return false}
function edited(name){if(name==='assessment.height'||name==='assessment.weight'){let el=$('#bmi');if(el)el.textContent=bmi()}if(name.startsWith('coverage.')&&['coverage.member','coverage.payer','coverage.expiry','coverage.network'].includes(name)){R.coverage.eligibility='Not checked';R.coverage.verifiedAt='';ctx.coverageCollapsed=false}if(name.startsWith('coverage.'))renderFoot()}
document.addEventListener('input',e=>{lastActivity=Date.now();const t=e.target;
 if(t.id==='patient-search'){ctx.query=t.value;ctx.searchIndex=-1;if(ctx.query&&ctx.filter==='appointments'){ctx.filter='all';document.querySelectorAll('[data-action="filter"]').forEach(b=>b.classList.toggle('active',b.dataset.value==='all'))}$('#patient-results').innerHTML=patientResults();return}
 if(t.id==='order-search'){orderQuery=t.value;$('#order-results').innerHTML=orderResults();return}
 if(t.id==='schedule-search'){scheduleQuery=t.value;$('#schedule-results').innerHTML=scheduleResults();return}
 if(t.id==='worklist-search'){$('#worklist-results').innerHTML=worklistResults(t.value);return}
 if(t.id==='audit-search'){$('#audit-results').innerHTML=auditResults(t.value);return}
 if(t.closest('#modal'))return;
 if(t.name&&!(t instanceof HTMLSelectElement)&&t.type!=='checkbox'&&editAllowed(t.name)){setPath(R,t.name,t.value);edited(t.name)}
});
document.addEventListener('change',e=>{lastActivity=Date.now();const t=e.target,name=t.name;if(!name)return;
 if(name==='ctx.role'){roleSwitch(t.value);return}
 if(name==='ctx.branch'){let branch=t.value;if(branch===ctx.branch)return;renderHeader();modal('Change branch context?','Only the selected branch’s worklist will be shown.',notice('Any unfinished registration is saved as an in-memory draft. An existing encounter remains assigned to its original branch.','amber','building'),B('Stay in current branch','close-modal')+B('Switch branch','confirm-branch','primary',`data-value="${esc(branch)}"`));return}
 if(name==='ctx.searchBy'){ctx.searchBy=t.value;ctx.searchIndex=-1;$('#patient-results').innerHTML=patientResults();return}
 if(name==='schedule.date'){scheduleDate=t.value;$('#schedule-results').innerHTML=scheduleResults();return}
 if(t.closest('#modal'))return;
 if(!editAllowed(name))return;
 let value=t.type==='checkbox'?t.checked:t.value;setPath(R,name,value);edited(name);
 if(name==='visit.template'){applyTemplate(value);ctx.errors=[];renderFocused();return}
 if(name==='visit.specialty'){let p=providers.find(p=>p.specialty===value);R.visit.provider=p.id;R.visit.clinic=p.room;R.followup.provider=p.id;R.coverage.eligibility='Not checked';R.coverage.verifiedAt='';renderFocused();return}
 if(name==='visit.provider'){R.visit.clinic=provider().room;R.followup.provider=R.visit.provider;R.coverage.eligibility='Not checked';R.coverage.verifiedAt='';renderFocused();return}
 if(['coverage.auth','coverage.payer','coverage.expiry','coverage.rate','coverage.deductible','coverage.approved','coverage.used','visit.priority','visit.episode','visit.caseId','visit.mode','consent.treatment','consent.privacy','followup.needed'].includes(name)){ctx.errors=[];renderFocused();return}
 if(name.startsWith('ident.')||name==='consent.reviewed'){ctx.errors=[];renderFoot()}
});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||b.disabled)return;e.preventDefault();lastActivity=Date.now();Promise.resolve(act(b.dataset.action,b)).catch(err=>{console.error('Demo action error:',err);toast('This demo action could not be completed. No external operation occurred.',true)})});
document.addEventListener('submit',e=>e.preventDefault());
document.addEventListener('keydown',e=>{lastActivity=Date.now();if(ctx.locked)return;if(e.altKey&&e.key.toLowerCase()==='p'){e.preventDefault();ctx.privacy=!ctx.privacy;if(ctx.privacy)closeModal();renderPrivacy();return}if(ctx.privacy)return;if(e.altKey&&e.key.toLowerCase()==='k'){e.preventDefault();if(R.id)return worklistModal();ctx.step=1;render();$('#patient-search')?.focus();return}if(e.altKey&&e.key==='Enter'&&!$('#modal').open){e.preventDefault();if(!R.id&&ctx.step<4)tryStep(ctx.step+1);else if(!R.id)register();return}if(e.target.id==='patient-search'){let matches=matchedPatients();if(['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();ctx.searchIndex=e.key==='ArrowDown'?Math.min(matches.length-1,ctx.searchIndex+1):Math.max(0,ctx.searchIndex-1);$('#patient-results').innerHTML=patientResults();$('#patient-results tr.keyboard')?.scrollIntoView({block:'nearest'});return}if(e.key==='Enter'&&matches.length){e.preventDefault();choosePatient(matches[Math.max(0,ctx.searchIndex)].id)}}});
$('#modal').addEventListener('close',()=>{modalType=''});
window.addEventListener('afterprint',()=>{$('#print-root').innerHTML='';$('#print-root').hidden=true});
window.addEventListener('beforeunload',e=>{if(R.patientId||visits.length||drafts.length){e.preventDefault();e.returnValue=''}});
let lastActivity=Date.now(),idleMinutes=10;
['pointerdown','keydown','touchstart'].forEach(event=>document.addEventListener(event,()=>{lastActivity=Date.now()},{passive:true}));
setInterval(()=>{if(!ctx.locked&&Date.now()-lastActivity>idleMinutes*60000)locked()},15000);
log('Synthetic OP workspace initialized','ALLY-DEMO');render();
</script>
