# Add INSIDE each `server { listen 443 ... }` block that proxies /api/, above the
# existing `location /api/`. nginx matches exact-prefix locations longest-first,
# so this only affects the speech socket and leaves every other API call alone.
#
#   proxy_set_header Connection "";   <-- the existing /api/ block sets this,
#   which is correct for keep-alive HTTP and is exactly what kills a WebSocket
#   upgrade. The socket needs its own location.

location /api/speech {
    proxy_pass http://fd_api/speech;
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host       $host;
    proxy_set_header X-Real-IP  $remote_addr;

    # A consultation runs for minutes with no HTTP traffic on the socket between
    # utterances. The default 60s read timeout would drop it mid-sentence.
    proxy_read_timeout  3600s;
    proxy_send_timeout  3600s;
    proxy_buffering     off;
}
